# Optional v2.1 patch — append to stress_quant_v2 / Quant stress suite
# Source also: /workspace/investments/research_evals/jev_stress_goals_v2.yaml (S7b)
cases:
  - id: QS7b_corporate_tos_stripe_aws
    bucket: terms_policy_ops_review
    expect: mixed
    why_hard: "Long legal pages, cookie banners, possible geo variants; must extract real quoted clauses from two vendors without inventing text."
    start_url: "https://stripe.com/legal/ssa"
    goal: >
      Operations review across vendor terms (public pages only).
      Open Stripe's service/terms legal page (start from this SSA/legal URL; if redirected to a Terms landing, follow the main Services Agreement / Terms of Service link).
      Find and quote a short visible sentence about acceptable use, prohibited activities, or API/automated access restrictions if present.
      Then open https://aws.amazon.com/service-terms/ and find a clause or definition related to your content / customer content or acceptable use; quote one short visible phrase.
      Stop when both sites have been visited and notes include two short verbatim quotes (one Stripe, one AWS) OR an explicit block report if a page will not load. Do not invent legal text.
    success_criteria:
      - "Visited a stripe.com legal/terms/SSA URL with legal body text visible"
      - "Visited aws.amazon.com/service-terms (or clearly linked Service Terms child page)"
      - "Grade nav on URLs/visible text; quotes are post-nav CoS/Quant layer"
